name: parkit_mobile
description: "ParkIt - Privacy-Preserving Federated Learning Smart Parking Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Mapping & Geolocation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Data Visualization & Charts
  fl_chart: ^0.69.2

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & Serialization
  http: ^1.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

